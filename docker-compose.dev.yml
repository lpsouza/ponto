services:
  # PocketBase for local development
  pb:
    image: alpine:latest
    container_name: ponto-pb-dev
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
      - ./pb_hooks:/pb/pb_hooks
    environment:
      - PB_VERSION=0.36.4
    working_dir: /pb
    command: >
      sh -c "
        apk add --no-cache unzip ca-certificates curl &&
        if [ ! -f pocketbase ]; then
          curl -L https://github.com/pocketbase/pocketbase/releases/download/v$${PB_VERSION}/pocketbase_$${PB_VERSION}_linux_amd64.zip -o pb.zip &&
          unzip pb.zip &&
          rm pb.zip;
        fi &&
        ./pocketbase serve --http=0.0.0.0:8090 --dir=/pb/pb_data
      "
    restart: unless-stopped

volumes:
  pb_data:
    name: ponto_pb_data
