

services:
  pocketbase:
    image: alpine:latest
    container_name: ponto-livre-pocketbase-dev
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations
    command: >
      /bin/sh -c "
      apk add --no-cache wget unzip ca-certificates &&
      wget https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip &&
      unzip pocketbase_0.22.22_linux_amd64.zip &&
      ./pocketbase serve --http=0.0.0.0:8090 --dir=/pb/pb_data --migrationsDir=/pb/pb_migrations --automigrate
      "
